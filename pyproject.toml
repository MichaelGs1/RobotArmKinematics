[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematics"
version = "0.1.0"
description = "Kinematics package"
authors = [{name = "Michaël Gross"}]
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "torch",
    "numba",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.per-file-ignores]
"tests/*" = ["N802", "N803"]

[scripts]
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"  # Si tu veux aussi formater le code