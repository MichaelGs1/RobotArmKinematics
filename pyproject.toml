[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematics"
version = "0.1.0"
description = "Kinematics package"
authors = [{name = "Michaël Gross"}]
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "torch",
    "numba",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F401", "F403", "F405", "UP045"]
ignore = ["E501"]
fixable = ["I", "F401"]
unfixable = []
per-file-ignores = { "tests/*" = ["F401", "N802", "N803", "N806"] }


[scripts]
lint = "ruff check src/ tests/ examples"
format = "ruff format src/ tests/ examples" 