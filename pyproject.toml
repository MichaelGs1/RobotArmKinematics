[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot_arm_kinematics"
version = "1.0.0"
description = "Robot arm kinematics package"
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICENSE*"]
authors = [
    {name = "Michaël Gross"},
    {name = "ALTEN SA"},
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "numba",
    "matplotlib",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/MichaelGs1/RobotArmKinematics"
Issues = "https://github.com/MichaelGs1/RobotArmKinematics/issues"


[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "pre_commit>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F401", "F403", "F405", "UP045"]
ignore = ["E501"]
fixable = ["I", "F401"]
unfixable = []
per-file-ignores = { "tests/*" = ["F401", "N802", "N803", "N806"] }

[tool.mypy]
python_version = 3.11
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "numba.*,scipy.*,tqdm.*"
ignore_missing_imports = true